name: Offline utility regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-utils:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest
      - name: Test utility functions without live market requests
        run: python -m pytest tests/test_utils.py tests/test_intraday_event_merge.py -q
